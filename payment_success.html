<!DOCTYPE html>
<html>
<head>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <title>Acme SaaS - Payment Successful</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M14.26 10.098L3.389 17.166 1.564 24h9.008l3.688-13.902Z%22 fill=%22%230c2451%22/><path d=%22M22.436 0l-11.91 7.773-1.174 4.276 6.625-4.297L11.65 24h4.391l6.395-24z%22 fill=%22%233395ff%22/></svg>">
    <style>
        :root {
            --rp-navy: #0b192c;
            --rp-blue: #0c6cff;
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --success-color: #38a169;
        }
        [data-theme="dark"] {
            --bg: #090d16;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --border-color: #1f2937;
            --rp-navy: #1f2937;
        }
        [data-theme="dark"] .metadata-box {
            background-color: #1a202c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .success-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background-color: #f0fff4;
            border: 2px solid #c6f6d5;
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 24px;
            box-shadow: 0 4px 10px rgba(56, 161, 105, 0.1);
        }
        .title {
            font-size: 22px;
            font-weight: 800;
            color: var(--rp-navy);
            margin-bottom: 10px;
        }
        .message {
            font-size: 14px;
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .details-box {
            background-color: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            width: 100%;
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            color: #718096;
        }
        .detail-value {
            font-weight: 700;
            color: var(--rp-navy);
        }
        .countdown {
            font-size: 12px;
            color: #a0aec0;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #edf2f7;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            background-color: var(--rp-blue);
            transition: width 1s linear;
        }
        .btn-console {
            background-color: var(--rp-navy);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-console:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">✓</div>
        <div class="title">Payment Successful!</div>
        <div class="message">Your subscription to the Pro Annual Plan is now active. Welcome to Acme SaaS!</div>
        
        <div class="details-box">
            <div class="detail-row">
                <span class="detail-label">Payment ID</span>
                <span id="payment-id-display" class="detail-value">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount Billed</span>
                <span class="detail-value">₹4,999.00</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" style="color: var(--success-color);">Success</span>
            </div>
        </div>

        <div id="countdown-text" class="countdown">Redirecting to Admin Console in 10 seconds...</div>
        <div class="progress-bar-container">
            <div id="pb" class="progress-bar"></div>
        </div>

        <a href="/admin_console" class="btn-console">Go to Admin Console Immediately</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id') || 'pay_mock_' + Math.random().toString(36).substr(2, 9);
        document.getElementById('payment-id-display').innerText = paymentId;

        let secondsLeft = 10;
        const progressBar = document.getElementById('pb');
        const countdownText = document.getElementById('countdown-text');

        const interval = setInterval(() => {
            secondsLeft--;
            countdownText.innerText = `Redirecting to Admin Console in ${secondsLeft} seconds...`;
            progressBar.style.width = (secondsLeft * 10) + '%';

            if (secondsLeft <= 0) {
                clearInterval(interval);
                window.location.href = "/admin_console";
            }
        }, 1000);
    </script>
</body>
</html>
